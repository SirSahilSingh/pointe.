<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pointe</title>
  <script type="text/javascript" src="/eel.js"></script>
  <script type="text/javascript">
    // Expose Eel callbacks SYNCHRONOUSLY before React loads.
    // Python's stream_camera calls eel.updateImage() — it must exist early.
    // React will set the window._eel* callbacks when it mounts.
    window._eelFrameCallback = null;
    window._eelTelemetryCallback = null;
    window._eelLightCallback = null;
    window._eelCameraMetaCallback = null;

    eel.expose(updateImage);
    function updateImage(base64Img) {
      if (window._eelFrameCallback) window._eelFrameCallback(base64Img);
    }

    eel.expose(updateTelemetry);
    function updateTelemetry(detected) {
      if (window._eelTelemetryCallback) window._eelTelemetryCallback(detected);
    }

    eel.expose(updateLightWarning);
    function updateLightWarning(isLow) {
      if (window._eelLightCallback) window._eelLightCallback(isLow);
    }

    eel.expose(updateCameraMeta);
    function updateCameraMeta(meta) {
      if (window._eelCameraMetaCallback) window._eelCameraMetaCallback(meta);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
