<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>pointe - Phone Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #f0ece4;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f0ece4;
        }

        .brand img {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a09888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fbbf24;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.connected {
            background: #4ade80;
        }

        .status-dot.error {
            background: #f87171;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #242424;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .overlay-badge,
        .meta-badge {
            position: absolute;
            top: 12px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .overlay-badge {
            left: 12px;
            color: #4ade80;
        }

        .meta-badge {
            right: 12px;
            color: #c8b89a;
        }

        .info {
            font-size: 11px;
            color: #5a5248;
            text-align: center;
            line-height: 1.5;
        }

        .error-msg {
            color: #f87171;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        .controls {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .flip-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: #f0ece4;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <img src="/logo.png" alt="pointe" />
            <span>pointe</span>
        </div>

        <div class="status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Connecting...</span>
        </div>

        <div class="video-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <span class="overlay-badge" id="stream-badge">PAIRING</span>
            <span class="meta-badge" id="meta-badge">WEBRTC</span>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="controls">
            <button class="flip-btn" id="flip-btn" type="button">Flip Camera</button>
        </div>

        <div class="info">
            Keep this page open to stream your camera.<br>
            Do not switch to another app.
        </div>
    </div>

    <script>
        const SIGNAL_URL = "__SIGNAL_URL__";
        const ICE_SERVERS = __ICE_SERVERS__;

        const video = document.getElementById("video");
        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const streamBadge = document.getElementById("stream-badge");
        const metaBadge = document.getElementById("meta-badge");
        const errorMsg = document.getElementById("error-msg");
        const flipBtn = document.getElementById("flip-btn");

        let ws = null;
        let pc = null;
        let localStream = null;
        let reconnectDelay = 1000;
        let wakeLock = null;
        let signalOpenedOnce = false;
        let currentFacingMode = "user";

        async function startCamera(facingMode = currentFacingMode) {
            try {
                if (localStream) {
                    localStream.getTracks().forEach((track) => track.stop());
                }
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                currentFacingMode = facingMode;
                video.srcObject = localStream;
                video.style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "none";
                await video.play();
                if (!pc) {
                    connectSignal();
                } else {
                    await replaceVideoTrack();
                }
            } catch (err) {
                showError("Camera access denied. Please allow camera permission and reload.");
            }
        }

        async function replaceVideoTrack() {
            if (!pc || !localStream) {
                return;
            }
            const [track] = localStream.getVideoTracks();
            const sender = pc.getSenders().find((item) => item.track && item.track.kind === "video");
            if (!track || !sender) {
                return;
            }
            await sender.replaceTrack(track);
        }

        function connectSignal() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }

            try {
                setStatus("waiting", "Opening secure link...");
                streamBadge.innerText = "PAIRING";
                ws = new WebSocket(SIGNAL_URL);

                ws.onopen = async () => {
                    signalOpenedOnce = true;
                    reconnectDelay = 1000;
                    setStatus("waiting", "Negotiating WebRTC...");
                    await startPeerConnection();
                };

                ws.onmessage = async (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (!pc) {
                            return;
                        }

                        if (data.type === "answer") {
                            await pc.setRemoteDescription({
                                type: "answer",
                                sdp: data.sdp
                            });
                        } else if (data.type === "candidate") {
                            await pc.addIceCandidate(data.candidate);
                        }
                    } catch (err) {
                        console.error("Signal message failed:", err);
                    }
                };

                ws.onclose = () => {
                    if (!signalOpenedOnce) {
                        showError("Couldn't open Pointe's secure pairing channel. Reload the QR page after trusting the secure link.");
                        return;
                    }
                    setStatus("waiting", "Disconnected - reconnecting...");
                    streamBadge.innerText = "RECONNECTING";
                    closePeer();
                    setTimeout(connectSignal, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 1.5, 5000);
                };

                ws.onerror = () => {
                    if (ws) {
                        ws.close();
                    }
                };
            } catch (err) {
                showError("Couldn't start secure pairing. Please reload the page and try again.");
                setTimeout(connectSignal, reconnectDelay);
            }
        }

        async function startPeerConnection() {
            closePeer();

            pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

            localStream.getTracks().forEach((track) => {
                pc.addTrack(track, localStream);
            });

            pc.onicecandidate = ({ candidate }) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    return;
                }
                ws.send(JSON.stringify({
                    type: "candidate",
                    candidate: candidate ? {
                        candidate: candidate.candidate,
                        sdpMid: candidate.sdpMid,
                        sdpMLineIndex: candidate.sdpMLineIndex
                    } : null
                }));
            };

            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                metaBadge.innerText = state.toUpperCase();
                if (state === "connected") {
                    setStatus("connected", "Streaming to Pointe");
                    streamBadge.innerText = "LIVE";
                } else if (state === "connecting") {
                    setStatus("waiting", "Connecting media path...");
                    streamBadge.innerText = "PAIRING";
                } else if (state === "failed" || state === "disconnected") {
                    setStatus("waiting", "Connection dropped - retrying...");
                    streamBadge.innerText = "RECONNECTING";
                }
            };

            const offer = await pc.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: false
            });
            await pc.setLocalDescription(offer);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "offer",
                    sdp: pc.localDescription.sdp
                }));
            }
        }

        function closePeer() {
            if (pc) {
                try {
                    pc.onicecandidate = null;
                    pc.onconnectionstatechange = null;
                    pc.close();
                } catch (err) {
                    // Ignore cleanup errors.
                }
                pc = null;
            }
        }

        function setStatus(type, text) {
            statusDot.className =
                "status-dot" +
                (type === "connected" ? " connected" : type === "error" ? " error" : "");
            statusText.innerText = text;
        }

        function showError(message) {
            errorMsg.innerText = message;
            errorMsg.style.display = "block";
            setStatus("error", "Error");
            streamBadge.innerText = "ERROR";
            metaBadge.innerText = "FAILED";
        }

        flipBtn.addEventListener("click", async () => {
            const nextFacingMode = currentFacingMode === "user" ? "environment" : "user";
            await startCamera(nextFacingMode);
        });

        async function requestWakeLock() {
            try {
                if ("wakeLock" in navigator) {
                    wakeLock = await navigator.wakeLock.request("screen");
                }
            } catch (err) {
                // Ignore wake-lock failures on browsers that do not support it reliably.
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                requestWakeLock();
            }
        });

        window.addEventListener("beforeunload", () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "bye" }));
            }
            closePeer();
        });

        requestWakeLock();
        startCamera();
    </script>
</body>
</html>
